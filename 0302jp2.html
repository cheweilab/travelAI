<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>昭和レトロ メンズスパ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">

<style>

/* =========================
   CANVAS (Exact 2:3 Ratio)
========================= */
body{
    background:#cfc6b8;
    display:flex;
    justify-content:center;
    padding:40px;
}

.poster{
    width:900px;
    height:1350px;
    position:relative;
    background:#f3e6d2;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

/* =========================
   PAPER GRAIN
========================= */
.poster::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px);
    background-size:5px 5px;
    opacity:.4;
    pointer-events:none;
}

/* =========================
   GREEN DIAGONAL FIELD
   (Measured from image angle)
========================= */
.green{
    position:absolute;
    bottom:185px; /* matches white band height */
    width:100%;
    height:62%;
    background:#8dbf4f;
    clip-path:polygon(0 38%, 100% 22%, 100% 100%, 0% 100%);
}

.green::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.45) 2px, transparent 2px);
    background-size:13px 13px;
    opacity:.6;
}

/* =========================
   TOP MASCOT (Parody)
========================= */
.mascot{
    position:absolute;
    top:95px;
    left:460px;
    transform:translateX(-50%);
}

.mascot img{
    width:210px;
}

/* =========================
   VERTICAL HEADLINE
   Angle approx -8deg
========================= */
.headline{
    position:absolute;
    left:95px;
    top:320px;
    writing-mode:vertical-rl;
    font-family:'Noto Serif JP',serif;
    font-size:44px;
    letter-spacing:.18em;
    transform:rotate(-8deg);
}

/* =========================
   PRODUCT BOX (Spa Ticket)
   Angle approx -17deg
========================= */
.ticket{
    position:absolute;
    top:520px;
    left:170px;
    transform:rotate(-17deg);
    background:#f6c65e;
    padding:28px 34px;
    border:3px solid #a06500;
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:.15em;
}

/* =========================
   GROUP VISUAL
========================= */
.group{
    position:absolute;
    right:80px;
    top:505px;
}

.group img{
    width:500px;
}

/* =========================
   LEFT NAME STRIP
========================= */
.name{
    position:absolute;
    left:35px;
    bottom:270px;
    writing-mode:vertical-rl;
    border:1px solid #000;
    padding:12px 6px;
    font-family:'Noto Serif JP',serif;
    font-size:18px;
}

/* =========================
   TAGLINE
========================= */
.tagline{
    position:absolute;
    bottom:215px;
    left:110px;
    font-family:'Noto Serif JP',serif;
    font-size:22px;
    letter-spacing:.2em;
}

/* =========================
   WHITE BRAND STRIP
========================= */
.white-band{
    position:absolute;
    bottom:0;
    width:100%;
    height:185px; /* matched proportion */
    background:#fdf9f2;
    border-top:2px solid rgba(0,0,0,.15);
}

/* =========================
   LARGE BRAND NAME
========================= */
.brand{
    position:absolute;
    bottom:48px;
    left:85px;
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:96px;
    color:#c41616;
    letter-spacing:.05em;
}

/* =========================
   PRICE
========================= */
.price{
    position:absolute;
    bottom:72px;
    right:85px;
    font-family:'Noto Serif JP',serif;
    font-size:22px;
}

</style>
</head>

<body>

<div class="poster">

    <div class="green"></div>

    <!-- Mascot Parody (Replace image) -->
    <div class="mascot">
        <img src="hinoki-angel-placeholder.png" alt="紅檜エンゼル">
    </div>

    <!-- Vertical Headline -->
    <div class="headline">
        みんな ととのえ
    </div>

    <!-- Spa Ticket Box -->
    <div class="ticket">
        紅檜メンズスパ
    </div>

    <!-- Group Image -->
    <div class="group">
        <img src="relaxed-men-group-placeholder.png" alt="ととのった男性たち">
    </div>

    <!-- Name Strip -->
    <div class="name">
        ご予約
    </div>

    <!-- Tagline -->
    <div class="tagline">
        AI予約とGoogle近隣検索に対応しています
    </div>

    <!-- White Band -->
    <div class="white-band"></div>

    <!-- Big Brand Name -->
    <div class="brand">
        森林メンズスパ
    </div>

    <!-- Price Parody -->
    <div class="price">
        初回体験 1,000円
    </div>

</div>

</body>
</html>
